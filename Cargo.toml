[package]
name = "kondo"
version = "0.2.7"
edition = "2024"
authors = ["Scott A. Idler <scott.a.idler@gmail.com>"]
build = "build.rs"
description = "Organize files by moving them to the right directories based on extension"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
expand-tilde = { git = "ssh://git@github.com/scottidler/expand-tilde", tag = "v0.1.0", version = "0.1.0" }
env_logger = "0.11.9"
eyre = "0.6.12"
glob = "0.3.3"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
# Dependencies will be added via cargo add

[build-dependencies]

[dev-dependencies]
tempfile = "3.26.0"
# For build.rs if needed
